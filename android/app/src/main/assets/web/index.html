<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0e14">
<title>LinuxBox</title>
<link rel="stylesheet" href="xterm.css">
<style>
  :root {
    --bg: #0b0e14; --bar: #11151f; --line: #1b2230; --fg: #c8c8c8;
    --dim: #7c8798; --ok: #4ec9b0; --bad: #f07178; --accent: #61afef;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%; overflow: hidden; margin: 0; background: var(--bg); color: var(--fg);
    font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  #app { display: flex; flex-direction: column; height: var(--app-height, 100%); }

  /* ---- baris tab sesi ---- */
  #tabs {
    flex: 0 0 auto; display: flex; align-items: stretch; background: var(--bar);
    border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: hidden;
    scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 8px 10px; border-right: 1px solid var(--line); cursor: pointer;
    color: var(--dim); white-space: nowrap; user-select: none;
  }
  .tab.active { color: var(--fg); background: #161b27; box-shadow: inset 0 -2px 0 var(--accent); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .tab.alive .dot { background: var(--ok); }
  .tab.dead .dot { background: var(--bad); }
  .tab .close {
    padding: 0 4px; border-radius: 3px; color: var(--dim); font-weight: bold;
  }
  .tab .close:hover { background: #2a3245; color: var(--fg); }
  .tab.add { color: var(--accent); font-weight: bold; }

  /* ---- baris aksi ---- */
  #actions {
    flex: 0 0 auto; display: flex; gap: 6px; padding: 6px 8px;
    background: var(--bar); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  button.act {
    background: #1b2230; color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 9px; font-size: 12px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); }
  button.act:active { transform: translateY(1px); }
  #spacer { flex: 1 1 auto; }

  /* ---- terminal ---- */
  #term { flex: 1 1 auto; min-height: 0; padding: 6px; overflow: hidden; }
  #term .xterm-viewport {
    height: 100% !important; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  /* di layar sentuh, panning & seleksi native dimatikan; scroll ditangani JS */
  html.touch #term .xterm-screen,
  html.touch #term .xterm-rows,
  html.touch #term textarea.xterm-helper-textarea {
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
  }
  #overlay {
    position: fixed; inset: 0; background: rgba(11, 14, 20, .82);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    gap: 10px; z-index: 20; text-align: center; padding: 24px;
  }
  #overlay.show { display: flex; }
  #overlay .big { font-size: 16px; color: var(--fg); }
  #overlay .small { color: var(--dim); font-size: 12px; }
  .spinner {
    width: 22px; height: 22px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- status + tombol sentuh ---- */
  #status {
    flex: 0 0 auto; display: flex; align-items: center; gap: 10px;
    padding: 5px 10px; background: var(--bar); border-top: 1px solid var(--line);
    font: 11px/1.6 monospace; color: var(--dim);
    padding-bottom: calc(5px + env(safe-area-inset-bottom));
  }
  #state.ok { color: var(--ok); }
  #state.bad { color: var(--bad); }
  #state.wait { color: #e5c07b; }
  #keys {
    flex: 0 0 auto; display: flex; gap: 6px; padding: 6px 8px;
    background: var(--bar); border-top: 1px solid var(--line); overflow-x: auto;
  }
  #keys button {
    flex: 0 0 auto; min-width: 44px; height: 40px; touch-action: pan-x; background: #1b2230;
    color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
    font: 12px monospace; cursor: pointer;
  }
  #keys button:disabled { opacity: .5; cursor: wait; }
  #keys button.on {
    background: var(--accent); color: #0b0e14; border-color: var(--accent);
  }
  #selectionActions {
    position: fixed; right: 14px; bottom: 96px; z-index: 15;
    display: none; gap: 6px; padding: 5px; background: var(--bar); color: #0b0e14;
    border: none; border-radius: 20px; font: 13px monospace; font-weight: 700;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .5);
  }
  #selectionActions.show { display: flex; }
  #selectionActions button {
    min-height: 40px; padding: 6px 12px; border: 0; border-radius: 16px;
    background: var(--accent); color: #0b0e14; font-weight: 700;
  }
  .selection-handle {
    position: fixed; display: none; width: 44px; height: 44px; z-index: 14;
    padding: 0; border: 0; background: transparent; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    transform: translateX(-50%);
  }
  .selection-handle::before {
    content: ''; position: absolute; top: 0; left: 21px;
    width: 2px; height: 12px; background: var(--accent);
  }
  .selection-handle::after {
    content: ''; position: absolute; top: 10px; left: 13px;
    width: 18px; height: 18px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 1px 4px #000;
  }
  /* Awal di atas teks, akhir di bawah: hit area tidak bertumpuk meski
     hanya satu karakter dipilih di tepi layar. */
  #selectionStart { transform: translate(-50%, -100%); }
  #selectionStart::before { top: auto; bottom: 0; }
  #selectionStart::after { top: auto; bottom: 10px; }
  .selection-handle::before { transform: translateX(var(--stem-offset, 0px)); }
  #flash {
    position: fixed; left: 50%; bottom: 132px; transform: translateX(-50%);
    z-index: 40; display: none; padding: 7px 14px; background: #1b2230;
    color: var(--fg); border: 1px solid var(--line); border-radius: 5px;
    font: 12px monospace; pointer-events: none;
  }
  #flash.show { display: block; }
  #search {
    flex: 0 0 auto; display: none; align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--bar); border-bottom: 1px solid var(--line);
  }
  #search.show { display: flex; }
  #search input {
    flex: 1 1 auto; min-width: 80px; background: #0b0e14; color: var(--fg);
    border: 1px solid var(--line); border-radius: 5px; padding: 5px 8px;
    font: 12px monospace;
  }
  #searchCount { color: var(--dim); font: 11px monospace; min-width: 62px; text-align: center; }
  #distroSel {
    background: #1b2230; color: var(--fg); border: 1px solid var(--line);
    border-radius: 5px; padding: 5px 6px; font-size: 12px; max-width: 150px;
  }
  #pasteDialog {
    position: fixed; inset: 0; z-index: 30; background: rgba(11, 14, 20, .9);
    padding: 16px; display: flex; align-items: center; justify-content: center;
  }
  #pasteDialog[hidden] { display: none; }
  #pastePanel { width: 100%; max-width: 480px; padding: 16px; background: var(--bar); border-radius: 10px; }
  #pastePanel h2 { margin: 0 0 8px; font-size: 16px; }
  #pasteHint { color: var(--fg); }
  #pasteInput {
    width: 100%; height: 120px; max-height: 30vh; padding: 8px; resize: vertical;
    background: var(--bg); color: var(--fg); border: 1px solid var(--dim);
    border-radius: 5px; font: 14px monospace;
  }
  #pastePanel .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  #pastePanel button { min-height: 44px; }
  #fatal {
    display: none; color: var(--bad); font: 13px/1.6 monospace;
    padding: 16px; white-space: pre-wrap;
  }
  @media (hover: hover) and (pointer: fine) { #keys { display: none; } }
</style>
</head>
<body>
<div id="app">
  <div id="tabs"></div>
  <div id="actions">
    <button class="act" id="btnNew">+ Sesi</button>
    <select id="distroSel" title="Distro untuk sesi baru"></select>
    <button class="act" id="btnClear">Bersihkan</button>
    <button class="act" id="btnSearch">Cari</button>
    <button class="act" id="btnFontOut">A−</button>
    <button class="act" id="btnFontIn">A+</button>
    <button class="act" id="btnReconnect">Sambung ulang</button>
    <span id="spacer"></span>
    <button class="act" id="btnHelp">?</button>
  </div>
  <div id="search">
    <input id="searchInput" type="text" placeholder="cari di terminal…" autocomplete="off">
    <button class="act" id="searchPrev">‹</button>
    <button class="act" id="searchNext">›</button>
    <span id="searchCount"></span>
    <button class="act" id="searchClose">×</button>
  </div>
  <div id="term">
    <div id="selectionStart" class="selection-handle" aria-label="Awal seleksi"></div>
    <div id="selectionEnd" class="selection-handle" aria-label="Akhir seleksi"></div>
  </div>
  <div id="keys">
    <button id="pasteBtn" title="Tempel teks dari papan klip">Tempel</button>
    <button id="cursorModeBtn" aria-pressed="false" title="Mode kursor: geser kiri/kanan di terminal">Kursor</button>
    <button data-key="esc">esc</button>
    <button data-key="tab">tab</button>
    <button data-key="ctrl">ctrl</button>
    <button data-key="backspace" title="Hapus karakter sebelum kursor">⌫</button>
    <button data-key="home">home</button>
    <button data-key="end">end</button>
    <button data-key="minus">-</button>
    <button data-key="up">↑</button>
    <button data-key="down">↓</button>
    <button data-key="left">←</button>
    <button data-key="right">→</button>
    <button data-key="slash">/</button>
    <button data-key="pipe">|</button>
  </div>
  <div id="status">
    <span id="state" class="wait">menyambung…</span>
    <span id="info"></span>
  </div>
  <div id="selectionActions" role="group" aria-label="Seleksi teks">
    <button id="copyBtn">Salin</button>
    <button id="cancelSelection">Batal</button>
    <button id="typeBtn">Ketik</button>
  </div>
  <div id="flash" role="status" aria-live="polite"></div>
</div>
<div id="overlay"><div class="spinner"></div><div class="big" id="ovText">Menyambung…</div><div class="small" id="ovHint"></div></div>
<pre id="fatal"></pre>
<div id="pasteDialog" role="dialog" aria-modal="true" aria-labelledby="pasteTitle" aria-describedby="pasteHint" hidden>
  <div id="pastePanel">
    <h2 id="pasteTitle">Tempel ke terminal</h2>
    <p id="pasteHint"></p>
    <textarea id="pasteInput" aria-label="Teks yang akan ditempel" placeholder="Tempel teks di sini…" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    <div class="buttons">
      <button class="act" id="pasteCancel">Batal</button>
      <button class="act" id="pasteSend">Tempel ke terminal</button>
    </div>
  </div>
</div>

<script src="xterm.js"></script>
<script src="fit.js"></script>
<script src="search.js"></script>
<script src="weblinks.js"></script>
<script>
(function () {
  'use strict';

  var fatal = document.getElementById('fatal');
  var termEl = document.getElementById('term');
  var tabsEl = document.getElementById('tabs');
  var stateEl = document.getElementById('state');
  var infoEl = document.getElementById('info');
  var overlay = document.getElementById('overlay');
  var ovText = document.getElementById('ovText');
  var ovHint = document.getElementById('ovHint');

  function die(msg) {
    fatal.style.display = 'block';
    fatal.textContent = msg;
    setState('error', 'bad');
  }

  if (typeof Terminal === 'undefined') {
    die('xterm.js tidak termuat.\n\nAsset web (xterm.js, xterm.css, fit.js) belum ada di APK.\n' +
        'Jalankan: scripts/fetch-assets.sh (atau build ulang — tugas Gradle\n' +
        'downloadWebAssets akan mengunduhnya otomatis), lalu build ulang APK.');
    return;
  }

  // ---------------------------------------------------------------- state
  var sessionId = null;       // sesi yang sedang dibuka di tab ini
  var sessions = [];          // daftar sesi dari server
  var ws = null, ctl = null;
  var retries = 0;
  var reconnectTimer = null, reconnectCheckTimer = null, ctlReconnectTimer = null;
  var connectionEpoch = 0;    // invalidasi callback/timer dari koneksi sesi lama
  var sessionsRequest = 0;    // abaikan daftar sesi yang datang tidak berurutan
  var terminalReady = true;  // false selama antrean output sesi lama sedang dikuras
  var serverUp = true;
  var fontSize = 14;
  var distros = [];
  var storageOk = false;
  var prorootOk = false;

  var term = new Terminal({
    cursorBlink: true, fontFamily: 'monospace', fontSize: fontSize,
    theme: { background: '#0b0e14', foreground: '#c8c8c8' },
    scrollback: 5000
  });
  term.open(termEl);
  // Input helper bukan editor lokal: jangan biarkan autocorrect mengganti command.
  term.textarea.setAttribute('autocorrect', 'off');
  term.textarea.setAttribute('autocapitalize', 'off');
  term.textarea.setAttribute('autocomplete', 'off');
  term.textarea.spellcheck = false;

  var fit = null;
  if (typeof FitAddon !== 'undefined' && FitAddon.FitAddon) {
    fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
  }

  // pencarian (Ctrl-F) — addon opsional, terminal tetap jalan tanpanya
  var searchAddon = null;
  if (typeof SearchAddon !== 'undefined' && SearchAddon.SearchAddon) {
    searchAddon = new SearchAddon.SearchAddon();
    term.loadAddon(searchAddon);
  }
  // tautan http(s) di dalam terminal bisa diklik
  if (typeof WebLinksAddon !== 'undefined' && WebLinksAddon.WebLinksAddon) {
    term.loadAddon(new WebLinksAddon.WebLinksAddon());
  }

  // ---------------------------------------------------------------- util
  function tokenQuery() {
    var m = /[?&]token=([^&]*)/.exec(location.search || '');
    return m ? '?token=' + encodeURIComponent(decodeURIComponent(m[1])) : '';
  }
  function q(extra) {
    var base = tokenQuery();
    if (!extra) return base;
    return base ? base + '&' + extra : '?' + extra;
  }
  function setState(text, cls) {
    stateEl.textContent = text;
    stateEl.className = cls || '';
  }
  function showOverlay(text, hint) {
    ovText.textContent = text;
    ovHint.textContent = hint || '';
    overlay.classList.add('show');
  }
  function hideOverlay() { overlay.classList.remove('show'); }
  var fitTimer = null, fitPending = false;
  function queueFit() {
    // Browser Android modern mengecilkan visualViewport saja saat IME terbuka.
    // Resize grid sekali setelah animasi tenang, bukan setiap frame keyboard.
    var vv = window.visualViewport;
    if (vv && Math.abs(vv.scale - 1) < 0.01) {
      document.documentElement.style.setProperty('--app-height', Math.floor(vv.height) + 'px');
    }
    clearTimeout(fitTimer);
    fitTimer = setTimeout(doFit, 120);
  }
  function doFit() {
    // xterm 6 menghapus seleksi saat jumlah baris berubah. Tunda resize PTY
    // selama memilih: animasi keyboard menutup tidak boleh menghapus highlight
    // atau mengubah baris buffer di bawah jari. Fit kembali setelah selesai.
    if (touchSelection || gesture) { fitPending = true; syncSelection(); return; }
    fitPending = false;
    clearTimeout(fitTimer);
    try { if (fit) fit.fit(); } catch (e) {}
    sendSize();
  }

  // ---------------------------------------------------------------- API
  function api(path, opts) {
    return fetch(path + q(), opts || {}).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  // Isi dropdown sesi baru: shell native (kalau busybox ada) + distro terpasang.
  function refreshDistros() {
    var eng = api('/api/engines').catch(function () { return null; });
    var dis = api('/api/distros').catch(function () { return null; });
    return Promise.all([eng, dis]).then(function (r) {
      var engines = (r[0] && r[0].engines) || [];
      distros = ((r[1] && r[1].distros) || []).filter(function (x) { return x.installed; });
      var sel = document.getElementById('distroSel');
      var prev = sel.value;
      sel.innerHTML = '';
      function opt(value, label) {
        var o = document.createElement('option');
        o.value = value; o.textContent = label;
        sel.appendChild(o);
      }
      engines.forEach(function (e) {
        if (!e.available) return;
        if (e.id === 'native') opt('native:', e.label || 'Shell cepat (native)');
      });
      distros.forEach(function (x) { opt('distro:' + x.id, x.label || x.id); });
      if (prev) sel.value = prev;
      sel.style.display = (sel.options.length <= 1) ? 'none' : '';
      prorootOk = !!(r[0] && r[0].proroot);
    }).catch(function () {});
  }

  function refreshSessions() {
    var request = ++sessionsRequest;
    return api('/api/sessions').then(function (data) {
      if (request !== sessionsRequest) return null;
      sessions = data.sessions || [];
      serverUp = true;
      var exists = sessions.some(function (s) { return s.id === sessionId; });
      var next = exists ? sessionId : (sessions.length ? sessions[0].id : null);
      // Semua perubahan sesi aktif wajib melewati jalur yang menutup socket lama.
      // Mengubah sessionId + reset saja meninggalkan ws OPEN milik sesi terhapus.
      if (next !== sessionId) switchSession(next);
      else renderTabs();
      if (!next) { hideOverlay(); setState('tidak ada sesi', 'wait'); }
      infoEl.textContent = sessions.length + ' sesi · ' + fontSize + 'px';
      return sessions;
    }).catch(function () {
      if (request !== sessionsRequest) return null;
      // Kegagalan daftar sesi tidak berarti socket terminal ikut mati.
      setState('gagal memperbarui daftar sesi', 'bad');
      if (!ws || ws.readyState !== WebSocket.OPEN) scheduleReconnect();
      // null = gagal/usang, bukan daftar kosong yang memicu pembuatan sesi baru.
      return null;
    });
  }

  function renderTabs() {
    tabsEl.innerHTML = '';
    sessions.forEach(function (s) {
      var el = document.createElement('div');
      el.className = 'tab' + (s.id === sessionId ? ' active ' : ' ') + (s.alive ? 'alive' : 'dead');
      el.title = s.name + ' · ' + (s.kind === 'native'
          ? 'shell native' : (s.distro || '?')) + ' (klik 2x untuk ganti nama)';
      var dot = document.createElement('span');
      dot.className = 'dot';
      var label = document.createElement('span');
      label.textContent = s.name;
      var close = document.createElement('span');
      close.className = 'close';
      close.textContent = '×';
      close.title = 'Tutup sesi';
      el.appendChild(dot); el.appendChild(label); el.appendChild(close);
      el.addEventListener('click', function (e) {
        if (e.target === close) { killSession(s.id); return; }
        switchSession(s.id);
      });
      el.addEventListener('dblclick', function () { renameSession(s); });
      tabsEl.appendChild(el);
    });
    var add = document.createElement('div');
    add.className = 'tab add';
    add.textContent = '+ sesi baru';
    add.addEventListener('click', newSession);
    tabsEl.appendChild(add);
    doFit();
  }

  function newSession() {
    var sel = document.getElementById('distroSel');
    var v = (sel && sel.value) ? sel.value : '';
    var extra = '';
    if (v.indexOf('native:') === 0) extra = '?kind=native';
    else if (v.indexOf('distro:') === 0) extra = '?distro=' + encodeURIComponent(v.slice(7));
    api('/api/sessions' + extra, { method: 'POST' }).then(function (data) {
      if (data.error) { setState(data.error, 'bad'); return; }
      return refreshSessions().then(function () { switchSession(data.id); });
    }).catch(function (e) { setState('gagal buat sesi: ' + e.message, 'bad'); });
  }

  function killSession(id) {
    api('/api/sessions/' + id + '/kill', { method: 'POST' }).then(function () {
      // Terapkan hasil POST dulu, jangan menunggu GET untuk melepas socket mati.
      // Respons daftar yang dimulai sebelum POST selesai tidak boleh memulihkannya.
      sessionsRequest++;
      serverUp = true;
      sessions = sessions.filter(function (s) { return s.id !== id; });
      if (id === sessionId) switchSession(sessions.length ? sessions[0].id : null);
      else renderTabs(); // menutup tab nonaktif tidak mereset terminal yang aktif
      return refreshSessions().then(function (updated) {
        if (updated && !updated.length && !sessionId) newSession();
      });
    }).catch(function (e) { setState('gagal tutup sesi: ' + e.message, 'bad'); });
  }

  function renameSession(s) {
    var name = prompt('Nama sesi', s.name);
    if (name === null || !name.trim()) return;
    api('/api/sessions/' + s.id + '/rename?name=' + encodeURIComponent(name.trim()),
        { method: 'POST' }).then(refreshSessions);
  }

  function switchSession(id) {
    if (id === sessionId) return;
    closeSockets();
    sessionId = id;
    terminalReady = false;
    var epoch = connectionEpoch;
    finishSelection();
    renderTabs();
    hideOverlay();
    setState(id ? 'menyambung…' : 'tidak ada sesi', 'wait');
    // term.write diproses asinkron. Reset setelah output yang sudah mengantre
    // selesai, sebelum membuka ws baru dan menerima replay riwayat sesi tujuan.
    term.write('', function () {
      if (epoch !== connectionEpoch) return;
      term.reset();
      terminalReady = true;
      connect();
    });
  }

  // ---------------------------------------------------------------- socket
  function wsUrl(path, extra) {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var tail = extra ? (q(extra)) : q();
    return proto + '//' + location.host + path + tail;
  }

  var KEYMAP = {
    esc: '\x1b', tab: '\t', minus: '-',
    up: '\x1b[A', down: '\x1b[B', left: '\x1b[D', right: '\x1b[C',
    slash: '/', pipe: '|', backspace: '\x7f', home: '\x1b[H', end: '\x1b[F'
  };
  // decoder tombol saat kunci "ctrl" (lock) aktif: kirim ^X seperti Termux
  function ctrlKey(dk) {
    switch (dk) {
      case 'up': return '\x1b[1;5A';
      case 'down': return '\x1b[1;5B';
      case 'right': return '\x1b[1;5C';
      case 'left': return '\x1b[1;5D';
      case 'minus': return '\x1f';   // ^-
      case 'slash': return '\x1f';   // ^/
      case 'pipe': return '\x1c';    // ^|
      case 'esc': return '\x1b';
      case 'tab': return '\t';
    }
    return null;
  }
  var ctrlLock = false;

  function sendSize() {
    if (!ctl || ctl.readyState !== WebSocket.OPEN) return;

      flash('Gagal menempel. Coba lagi.', 3000);
    });
  });
  pasteSend.addEventListener('click', function () {
    if (sendPaste(pasteInput.value, pasteTarget)) closePasteDialog();
  });
  pasteCancel.addEventListener('click', closePasteDialog);
  pasteDialog.addEventListener('click', function (e) {
    if (e.target === pasteDialog) closePasteDialog();
  });
  pasteDialog.addEventListener('keydown', function (e) {
    e.stopPropagation(); // shortcut terminal/Cari tidak boleh mengambil fokus dialog
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closePasteDialog(); }
    if (e.key === 'Tab') {
      if (e.shiftKey && document.activeElement === pasteInput) { e.preventDefault(); pasteSend.focus(); }
      else if (!e.shiftKey && document.activeElement === pasteSend) { e.preventDefault(); pasteInput.focus(); }
    }
  });

  // ---------- pencarian di terminal ----------
  var searchBar = document.getElementById('search');
  var searchInput = document.getElementById('searchInput');
  var searchCount = document.getElementById('searchCount');

  function updateSearchCount(found) {
    searchCount.textContent = found ? 'ada' : (searchInput.value ? 'tidak ada' : '');
  }
  function findNext(back) {
    if (!searchAddon || !searchInput.value) return;
    if (back) searchAddon.findPrevious(searchInput.value);
    else searchAddon.findNext(searchInput.value);
  }
  function toggleSearch(show) {
    var willShow = (typeof show === 'boolean') ? show : !searchBar.classList.contains('show');
    if (willShow) {
      finishSelection();
      searchBar.classList.add('show');
      searchInput.focus();
      searchInput.select();
    } else {
      searchBar.classList.remove('show');
      searchCount.textContent = '';
      term.focus();
    }
  }
  searchInput.addEventListener('input', function () { findNext(false); });
  searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); findNext(e.shiftKey); }
    else if (e.key === 'Escape') { e.preventDefault(); toggleSearch(false); }
  });
  document.getElementById('searchNext').addEventListener('click', function () { findNext(false); });
  document.getElementById('searchPrev').addEventListener('click', function () { findNext(true); });
  document.getElementById('searchClose').addEventListener('click', function () { toggleSearch(false); });
  document.getElementById('btnSearch').addEventListener('click', function () { toggleSearch(); });
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) {
      e.preventDefault();
      toggleSearch(true);
    }
  });

  document.getElementById('btnNew').addEventListener('click', newSession);
  document.getElementById('btnClear').addEventListener('click', function () { finishSelection(); term.clear(); });
  document.getElementById('btnReconnect').addEventListener('click', function () {
    closeSockets();
    retries = 0;
    serverUp = true;
    refreshSessions().then(connect);
  });
  document.getElementById('btnFontIn').addEventListener('click', function () {
    fontSize = Math.min(28, fontSize + 1); term.options.fontSize = fontSize; doFit();
  });
  document.getElementById('btnFontOut').addEventListener('click', function () {
    fontSize = Math.max(8, fontSize - 1); term.options.fontSize = fontSize; doFit();
  });
  document.getElementById('btnHelp').addEventListener('click', function () {
    alert('LinuxBox\n\n' +
      '• Tab di atas = sesi terminal terpisah; proses di dalamnya tetap jalan\n' +
      '  walau browser ditutup atau koneksi putus.\n' +
      '• + Sesi untuk menambah, × pada tab untuk menutup, klik 2x untuk ganti nama.\n' +
      '• Kalau shell keluar (exit/crash), sesi otomatis hidup lagi.\n' +
      '• A+/A− mengubah ukuran huruf, Bersihkan mengosongkan layar saja.\n' +
      '• Cari (Ctrl-F) untuk mencari di scrollback; tautan bisa diklik.\n' +
      '• Tahan teks lalu tarik untuk memilih; geser marker awal/akhir untuk menyesuaikan.\n' +
      '• Salin menyalin seleksi, Batal menutupnya, Ketik membuka keyboard lagi.\n' +
      '• Tempel membaca papan klip; teks beberapa baris diperiksa sebelum dikirim.\n' +
      '• Kursor: aktifkan lalu geser kiri/kanan di terminal seperti trackpad.\n' +
      '• Pilihan distro di sebelah "+ Sesi" menentukan distro sesi baru,\n' +
      '  jadi satu tab bisa alpine dan tab lain ubuntu.\n' +
      '• status "sdcard ✓" berarti /sdcard di-bind ke dalam guest.\n\n' +
      'Tiga mesin: pilih "Shell cepat (native)" untuk busybox langsung tanpa\n' +
      'proot (paling ringan, tanpa distro), atau distro alpine/ubuntu.\n' +
      (prorootOk ? 'proroot tersedia: distro glibc jalan tanpa ptrace.'
                 : 'proroot tidak ada di APK: distro jalan lewat proot klasik.'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('#keys button[data-key]'), function (b) {
    b.addEventListener('click', function () {
      var dk = b.getAttribute('data-key');
      if (dk === 'ctrl') {
        ctrlLock = !ctrlLock;
        b.classList.toggle('on', ctrlLock);
        b.textContent = ctrlLock ? '^' : 'ctrl';
        return;
      }
      var plain = arrowKey(dk) || KEYMAP[dk];
      var k = ctrlLock ? (ctrlKey(dk) || plain) : plain;
      sendKey(k);
      // Fokus tidak dipindahkan sejak pointerdown, jadi tidak perlu focus()/blur().
    });
  });

  // ---------------------------------------------------------------- start
  setState('menyambung…', 'wait');
  showOverlay('Menyambung…', '');
  refreshDistros().then(function () {
    return refreshSessions();
  }).then(function () {
    hideOverlay();
    connect();
  });
  setInterval(watchdog, 15000);
  setInterval(function () { if (ws && ws.readyState === WebSocket.OPEN) sendSize(); }, 20000);
  queueFit();
  doFit();
})();
</script>
</body>
</html>
